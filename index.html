<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalie sua experiência</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            text-align: center;
        }
        .stars {
            font-size: 32px;
            color: #fbbc04;
            margin-bottom: 12px;
            letter-spacing: 4px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #111827;
        }
        p {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 12px;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background-color: #1a73e8;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
        }
        .btn-secondary {
            background-color: #f1f3f4;
            color: #3c4043;
            border: 1px solid #dadce0;
        }
        .hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 16px;
        }
        /* Esconde a interface visual inicialmente enquanto verifica se é Android */
        .hidden {
            display: none;
        }
    </style>
    <script>
        // Links já configurados com o seu Place ID
        const linkDiretoEstrelas = "https://search.google.com/local/writereview?placeid=ChIJ0YLSJONqz5QRVDtKuKDPWSU";
        const linkAppMaps = "https://www.google.com/maps/search/?api=1&query=Restaurante&query_place_id=ChIJ0YLSJONqz5QRVDtKuKDPWSU";

        // Detecta o sistema operacional do celular
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);

        // Se for Android, redireciona na hora (0 segundos) direto para as estrelas
        if (isAndroid) {
            window.location.replace(linkDiretoEstrelas);
        }
    </script>
</head>
<body>

    <div class="card" id="conteudo">
        <div class="stars">★★★★★</div>
        <h1>Gostou do atendimento?</h1>
        <p>Sua avaliação leva menos de 10 segundos e ajuda muito a nossa equipe!</p>

        <!-- Botão 1: Ideal para iPhone com app Google Maps instalado -->
        <a href="https://www.google.com/maps/search/?api=1&query=Restaurante&query_place_id=ChIJ0YLSJONqz5QRVDtKuKDPWSU" class="btn btn-primary">
            Abrir no App Google Maps
        </a>

        <!-- Botão 2: Ideal para quem já tem conta Google logada no Safari -->
        <a href="https://search.google.com/local/writereview?placeid=ChIJ0YLSJONqz5QRVDtKuKDPWSU" class="btn btn-secondary">
            Avaliar direto pelo Navegador
        </a>

        <p class="hint">No app do Maps, basta tocar na aba <strong>Avaliações</strong> para deixar suas estrelas.</p>
    </div>

    <script>
        // Garante que no Android a tela nem pisque antes de redirecionar
        if (isAndroid) {
            document.getElementById('conteudo').classList.add('hidden');
        }
    </script>

</body>
</html>
